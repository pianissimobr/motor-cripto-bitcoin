<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cadastro — Motor Cripto</title>
<link rel="stylesheet" href="/checkout.css">
</head>
<body>
<header>
  <strong>Motor Cripto</strong>
  <span class="muted">Portal do lojista</span>
</header>
<main>
  <section class="card narrow">
    <h1>Criar conta</h1>
    <form id="signup-form">
      <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
      <label>Crie uma senha (mínimo 8 caracteres)<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repita a senha<input id="password2" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="inline"><input id="show-password" type="checkbox"> Mostrar senha</label>
      <p class="muted">É com este e-mail e esta senha que você entra no portal.</p>
      <label>Nome da loja (opcional)<input id="merchant" maxlength="80" placeholder="Minha loja"></label>
      <button type="submit">Cadastrar</button>
    </form>
    <p id="erro" class="erro"></p>
    <p id="resultado" class="muted"></p>
    <div id="verify-box" class="hidden">
      <p class="muted">Enviamos um código de 6 dígitos para o seu e-mail.</p>
      <form id="verify-form">
        <label>Código<input id="verify-code" inputmode="numeric" maxlength="6" required></label>
        <button type="submit">Confirmar e-mail</button>
      </form>
      <p id="verify-status" class="muted"></p>
    </div>
    <p class="muted">Já tem conta? <a href="/login.html">Entrar</a></p>
  </section>
</main>
<script type="module" src="/signup.js"></script>
</body>
</html>
