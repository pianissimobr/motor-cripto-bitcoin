<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Recuperar senha — Motor Cripto</title>
<link rel="stylesheet" href="/checkout.css">
</head>
<body>
<header>
  <strong>Motor Cripto</strong>
  <span class="muted">Portal do lojista</span>
</header>
<main>
  <section class="card narrow">
    <h1>Recuperar senha</h1>
    <form id="ask-form">
      <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
      <button type="submit">Enviar código</button>
    </form>
    <p id="info" class="muted"></p>
    <form id="reset-form" class="hidden">
      <label>Código (6 dígitos)<input id="code" inputmode="numeric" maxlength="6"></label>
      <label>Ou o token do e-mail<input id="token" autocomplete="one-time-code"></label>
      <label>Nova senha (mínimo 8 caracteres)<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Repita a nova senha<input id="password2" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="inline"><input id="show-password" type="checkbox"> Mostrar senha</label>
      <button type="submit">Trocar senha</button>
    </form>
    <p id="erro" class="erro"></p>
    <p class="muted"><a href="/login.html">Voltar ao login</a></p>
  </section>
</main>
<script type="module" src="/forgot.js"></script>
</body>
</html>
