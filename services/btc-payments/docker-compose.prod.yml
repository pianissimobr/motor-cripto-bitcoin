services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - btc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    command: ["node", "dist/server.js"]
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "4580"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4580/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    command: ["node", "dist/worker.js"]
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Apenas o worker le o keystore. Ajuste o dono para UID 1000.
      - ./data:/app/data:ro
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  btc-db:
  caddy-data:
  caddy-config:
