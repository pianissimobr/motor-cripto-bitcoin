<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Entrar — Motor Cripto</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<header>
  <strong>Motor Cripto</strong>
  <span class="muted">Portal do lojista</span>
</header>
<main>
  <section class="card narrow">
    <h1>Entrar</h1>
    <form id="login-form">
      <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
      <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button>
    </form>
    <p id="erro" class="erro"></p>
    <div id="verify-box" class="hidden">
      <p class="muted">Enviamos um código de 6 dígitos para o seu e-mail no cadastro. Se ele expirou ou não chegou, peça outro.</p>
      <button type="button" id="resend" class="ghost">Reenviar código</button>
      <form id="verify-form">
        <label>Código<input id="verify-code" inputmode="numeric" maxlength="6"></label>
        <button type="submit">Confirmar e entrar</button>
      </form>
      <form id="verify-token-form" class="hidden">
        <label>Token do e-mail<input id="verify-token" autocomplete="one-time-code"></label>
        <button type="submit">Confirmar com token</button>
      </form>
      <p id="verify-status" class="muted"></p>
    </div>
    <p class="muted">Não tem conta? <a href="/signup.html">Cadastre-se</a> · <a href="/forgot.html">Esqueci a senha</a></p>
  </section>
</main>
<script type="module" src="/login.js"></script>
</body>
</html>
