<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cadastro — Motor Cripto</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<header>
  <strong>Motor Cripto</strong>
  <span class="muted">Portal do lojista</span>
</header>
<main>
  <section class="card narrow">
    <h1>Criar conta</h1>
    <form id="signup-form">
      <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
      <label>Senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Nome da loja (opcional)<input id="merchant" maxlength="80" placeholder="Minha loja"></label>
      <button type="submit">Cadastrar</button>
    </form>
    <p id="erro" class="erro"></p>
    <p id="resultado" class="muted"></p>
    <p class="muted">Já tem conta? <a href="/login.html">Entrar</a></p>
  </section>
</main>
<script type="module">
const form = document.getElementById('signup-form');
const erro = document.getElementById('erro');
const resultado = document.getElementById('resultado');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  erro.textContent = '';
  resultado.textContent = '';
  const payload = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
  };
  const merchant = document.getElementById('merchant').value.trim();
  if (merchant) payload.merchant_name = merchant;

  const res = await fetch('/auth/register', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    erro.textContent = body?.error?.message ?? 'Falha ao cadastrar';
    return;
  }
  resultado.innerHTML =
    'Conta criada. Guarde suas credenciais da API (são mostradas uma única vez).<br>' +
    `<pre class="creds">${escapeHtml(JSON.stringify(body.merchant, null, 2))}</pre>` +
    `Token de verificação (dev): <code>${escapeHtml(body.verification_token ?? '')}</code>. ` +
    '<a href="/login.html">Ir para o login</a>';
});
function escapeHtml(s) {
  return String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}
</script>
</body>
</html>
