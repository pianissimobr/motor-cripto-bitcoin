<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cadastro — Motor Cripto</title>
<link rel="stylesheet" href="/portal.css">
</head>
<body>
<header>
  <strong>Motor Cripto</strong>
  <span class="muted">Portal do lojista</span>
</header>
<main>
  <section class="card narrow">
    <h1>Criar conta</h1>
    <form id="signup-form">
      <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
      <label>Senha<input id="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Nome da loja (opcional)<input id="merchant" maxlength="80" placeholder="Minha loja"></label>
      <button type="submit">Cadastrar</button>
    </form>
    <p id="erro" class="erro"></p>
    <p id="resultado" class="muted"></p>
    <p class="muted">Já tem conta? <a href="/login.html">Entrar</a></p>
  </section>
</main>
<script type="module" src="/signup.js"></script>
</body>
</html>
