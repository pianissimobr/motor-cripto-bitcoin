<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Motor Cripto</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Motor Cripto</span>
    </div>
  </header>

  <main class="wrap">
    <h1>Entrar</h1>
    <p class="sub">Inscreva-se ou entre com usuário ou e-mail.</p>

    <section class="card" style="max-width:460px">
      <div class="acoes">
        <button class="primary" id="mostrar-login" type="button">Login</button>
        <a href="/inscricao.html"><button type="button">Inscreva-se</button></a>
      </div>

      <form id="login" hidden>
        <label for="identificador">Usuário ou e-mail</label>
        <input id="identificador" autocomplete="username" maxlength="320" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" maxlength="200" required>

        <div style="margin-top:16px">
          <button class="primary" type="submit">Entrar</button>
        </div>
        <div id="erro" class="error"></div>
      </form>
    </section>
  </main>

  <footer>
    <a class="loja-link" href="/cadastro.html">Área da loja</a>
  </footer>
  <script type="module" src="/index.js"></script>
</body>
</html>
