<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Minha conta</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Motor Cripto</span>
    </div>
    <button class="small ghost" id="sair" type="button">Sair</button>
  </header>

  <main class="wrap">
    <h1>Minha conta</h1>
    <p class="sub" id="ola">Carregando…</p>

    <div class="grid">
      <section class="card">
        <h2>Alterar dados</h2>
        <form id="dados">
          <label for="nome">Nome</label>
          <input id="nome" maxlength="200" required>
          <label for="email">E-mail</label>
          <input id="email" type="email" maxlength="320" required>
          <label for="usuario">Usuário</label>
          <input id="usuario" maxlength="32" required>
          <label for="senha">Nova senha (opcional)</label>
          <input id="senha" type="password" minlength="8" maxlength="200" autocomplete="new-password">
          <div style="margin-top:16px">
            <button class="primary" type="submit">Salvar</button>
          </div>
          <div id="dados-msg" class="ok-msg"></div>
          <div id="dados-erro" class="error"></div>
        </form>
      </section>

      <section class="card">
        <h2>Gerar cobrança</h2>
        <form id="cobranca">
          <label for="valor">Valor</label>
          <div class="valor-row">
            <input id="valor" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
            <button class="primary" type="submit">Enviar</button>
          </div>
          <div class="hint">Só número em reais. O envio abre o checkout para concluir o pagamento.</div>
          <div id="cobranca-erro" class="error"></div>
        </form>
      </section>
    </div>

    <section class="card" style="margin-top:20px">
      <button class="danger" id="abrir-excluir" type="button">Deletar conta</button>
    </section>
  </main>

  <div class="modal-fundo" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo">Excluir a conta?</h2>
      <p>Esta ação apaga o seu cadastro. Não há como desfazer.</p>
      <div class="acoes">
        <button id="cancelar" type="button">Cancelar</button>
        <button class="danger" id="confirmar" type="button">Sim, excluir</button>
      </div>
      <div id="excluir-erro" class="error"></div>
    </div>
  </div>

  <script type="module" src="/painel.js"></script>
</body>
</html>
