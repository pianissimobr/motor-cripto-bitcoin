<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Inscreva-se</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>Motor Cripto</span>
      <nav><a href="/index.html">Login</a></nav>
    </div>
  </header>

  <main class="wrap">
    <h1>Inscreva-se</h1>
    <p class="sub">Nome, e-mail, usuário e senha. A senha fica só como hash.</p>

    <section class="card" style="max-width:460px">
      <form id="form">
        <label for="nome">Nome</label>
        <input id="nome" maxlength="200" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" maxlength="320" required>

        <label for="usuario">Usuário</label>
        <input id="usuario" maxlength="32" autocomplete="username" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>

        <div style="margin-top:16px">
          <button class="primary" type="submit">Criar conta</button>
        </div>
        <div id="erro" class="error"></div>
      </form>
    </section>
  </main>
  <script type="module" src="/inscricao.js"></script>
</body>
</html>
